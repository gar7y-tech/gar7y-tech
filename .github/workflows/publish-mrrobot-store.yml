name: Publish MR ROBOT Store
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-mrrobot-store.yml"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Overlay MR ROBOT storefront source
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/mrrobot_payload.b64 <<'MRROBOT_PAYLOAD'

MRROBOT_PAYLOAD
          base64 -d /tmp/mrrobot_payload.b64 | tar -xzf - -C .
          rm -f .github/workflows/publish-mrrobot-store.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components data lib public package.json package-lock.json tsconfig.json next-env.d.ts next.config.ts postcss.config.mjs eslint.config.mjs vercel.json .vercelignore
          git add -A .github/workflows/publish-mrrobot-store.yml
          git commit -m "feat(mrrobot): publish Fortnite catalog"
          git push origin HEAD:main
