name: Publish MR ROBOT Store
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-mrrobot-store.yml"
      - ".mrrobot-payload.b64"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Overlay storefront source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .mrrobot-payload.b64 | tar -xzf - -C .
          rm -f .mrrobot-payload.b64
          rm -f .github/workflows/publish-mrrobot-store.yml

      - name: Commit storefront
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(mrrobot): publish Fortnite catalog"
          git push origin HEAD:main
