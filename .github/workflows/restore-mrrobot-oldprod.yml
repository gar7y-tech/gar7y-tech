name: Restore MR ROBOT Old Production
on:
  push:
    branches: [main]
    paths:
      - ".restore-parts/**"
      - ".github/workflows/restore-mrrobot-oldprod.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore saved storefront source
        shell: bash
        run: |
          set -euo pipefail
          cat .restore-parts/part-*.b64 > /tmp/mrrobot-oldprod.b64
          base64 -d /tmp/mrrobot-oldprod.b64 > /tmp/mrrobot-oldprod.tar.gz
          test "$(sha256sum /tmp/mrrobot-oldprod.tar.gz | awk '{print $1}')" = "b04405b8af98282b58df7e38caefbd6d0466a9eda21b7e52c880e775ec12d035"

          rm -rf app components data lib public scripts tests evidence
          rm -f package.json package-lock.json tsconfig.json tsconfig.tsbuildinfo next-env.d.ts next.config.ts postcss.config.mjs eslint.config.mjs vercel.json .vercelignore playwright.config.ts
          rm -f MANUAL-PUBLISH-AR.md QA-RESULTS.md
          tar -xzf /tmp/mrrobot-oldprod.tar.gz -C .

          rm -rf .restore-parts
          rm -f .mrrobot-payload.b64
          rm -f .github/workflows/publish-mrrobot-store.yml
          rm -f .github/workflows/restore-mrrobot-oldprod.yml

      - name: Commit exact saved storefront
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "revert(mrrobot): restore saved pre-Fortnite storefront"
          git push origin HEAD:main
